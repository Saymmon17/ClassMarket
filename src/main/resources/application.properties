# ── Servidor ──────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Startup silencioso ────────────────────────────────────────────────────
spring.main.banner-mode=off
spring.jpa.open-in-view=false

# ── Banco de dados MySQL ───────────────────────────────────────────────────
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/classmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Manaus&characterEncoding=UTF-8}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:012356}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection pooling (HikariCP) ─────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# ── JWT ───────────────────────────────────────────────────────────────────
classmarket.jwt.secret=Y2xhc3NtYXJrZXQtc2VjcmV0LWtleS1kZXZlLXNlci10cm9jYWRhLWVtLXByb2R1Y2Fv
classmarket.jwt.expiration-ms=86400000

# ── Upload de imagens ──────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
classmarket.upload.dir=uploads

# ── Logs ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.classmarket=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.boot.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN
logging.level.org.hibernate.orm.connections=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.zaxxer.hikari.HikariConfig=WARN
logging.level.org.apache=WARN
logging.level.io.jsonwebtoken=WARN