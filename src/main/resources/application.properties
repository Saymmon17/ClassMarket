# ── Servidor ──────────────────────────────────────────────────────────────
server.port=8080

# ── Banco de dados MySQL ───────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/classmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Manaus&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=012356
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────────────────
# Gere uma chave segura para produção (mínimo 256 bits em Base64)
classmarket.jwt.secret=Y2xhc3NtYXJrZXQtc2VjcmV0LWtleS1kZXZlLXNlci10cm9jYWRhLWVtLXByb2R1Y2Fv
classmarket.jwt.expiration-ms=86400000

# ── Upload de imagens ──────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
classmarket.upload.dir=uploads

# ── Logs ──────────────────────────────────────────────────────────────────
logging.level.com.classmarket=DEBUG
logging.level.org.springframework.security=WARN
